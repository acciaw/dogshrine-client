name: Release

# builds the Dog Shrine desktop launcher for Windows, Linux, and macOS in parallel and
# publishes all three to a single GitHub Release matching the pushed tag. electron-updater
# (src/main/updater.js) reads that release back to check for updates, so the tag pattern
# here and GITHUB_OWNER/GITHUB_REPO in src/main/updateConfig.js have to keep pointing at
# this same repo (this workflow lives in the client-only repo, not a dogshrine monorepo).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned build: no Apple Developer cert is configured, so force electron-builder
          # to skip auto-discovering a signing identity instead of erroring looking for one
          CSC_IDENTITY_AUTO_DISCOVERY: false
